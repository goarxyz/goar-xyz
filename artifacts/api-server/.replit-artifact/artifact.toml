kind = "web"
previewPath = "/"
title = "GOAR"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "GOAR Flask Server"
paths = ["/"]

[services.env]
PORT = "8080"
BASE_PATH = "/"
GOAR_HOST = "0.0.0.0"
GOAR_PORT = "8080"
GOAR_HOME = "/home/runner/.goar"
GOAR_WORKSPACE = "/home/runner/.goar/workspace"
GOAR_AUTO_INSTALL_DESKTOP = "1"
PYTHONUNBUFFERED = "1"

[services.development]
run = "bash run-goar.sh"

[services.production]

[services.production.build]
args = ["bash", "artifacts/api-server/build-goar.sh"]

[services.production.build.env]
GOAR_AUTO_INSTALL_DESKTOP = "1"
PYTHONUNBUFFERED = "1"

[services.production.run]
args = ["bash", "artifacts/api-server/run-goar.sh"]

[services.production.run.env]
PORT = "8080"
BASE_PATH = "/"
GOAR_HOST = "0.0.0.0"
GOAR_PORT = "8080"
GOAR_HOME = "/home/runner/.goar"
GOAR_WORKSPACE = "/home/runner/.goar/workspace"
GOAR_AUTO_INSTALL_DESKTOP = "1"
PYTHONUNBUFFERED = "1"

[services.production.health.startup]
path = "/health"
