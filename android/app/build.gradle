import java.util.Properties

plugins {
    id 'com.android.application'
}

// Keep signing credentials out of source control. See android/README.md for
// the release-signing.properties format used by reproducible release builds.
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('release-signing.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .every { releaseSigningProperties.getProperty(it) }
def requestedAbi = (project.findProperty('goarTargetAbi') ?: 'arm64-v8a').toString()
def requestedManifestUrl = (project.findProperty('goarManifestUrl') ?: 'https://github.com/goarxyz/goar-xyz/releases/download/goar-android-v1/goar-rootfs-arm64-v8a.json').toString()

android {
    namespace 'com.goar.os'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goar.os'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.1.0'
        buildConfigField 'String', 'DEFAULT_MANIFEST_URL', '"' + requestedManifestUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'TARGET_ROOTFS_ARCH', '"' + requestedAbi.replace('\\', '\\\\').replace('"', '\\"') + '"'
        ndk {
            abiFilters requestedAbi
        }
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
