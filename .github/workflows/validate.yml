name: Validate GOAR OS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared runtime dependencies
        run: python -m pip install -r goar-production/requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q goar-production
          python -m unittest discover -s tests -v
          git diff --check

      - name: Validate Compose definition
        run: docker compose -f compose.yaml config --quiet

      - name: Build self-contained image
        run: docker build --tag goar-os:ci goar-production
